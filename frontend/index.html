<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaymentTrace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .status {
            background: #f0f4f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .status h2 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        .badge {
            display: inline-block;
            background: #fbbf24;
            color: #78350f;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .note {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PaymentTrace</h1>
        <p class="subtitle">Developer diagnostic tool for payment journey investigation</p>
        
        <div class="status">
            <h2>Project Status</h2>
            <span class="badge">Phase 0: Setup</span>
        </div>
        
        <div class="note">
            <p>This is a minimal Phase 0 foundation.</p>
            <p>No diagnostic functionality has been implemented yet.</p>
            <p style="margin-top: 1rem;">
                Backend API: <a href="http://localhost:8000/docs" target="_blank">http://localhost:8000/docs</a>
            </p>
        </div>
    </div>
</body>
</html>
